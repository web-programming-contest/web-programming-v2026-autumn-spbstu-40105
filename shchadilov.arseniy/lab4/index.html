<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Лабораторная работа 4</h1>

      <form class="car-form" data-testid="entity-form">
        <label class="form-field">
          <span>Марка</span>
          <input
            type="text"
            name="make"
            placeholder="Например, Toyota"
            required
          />
        </label>
        <label class="form-field">
          <span>Модель</span>
          <input
            type="text"
            name="model"
            placeholder="Например, Camry"
            required
          />
        </label>
        <button class="btn-primary" type="submit">Добавить автомобиль</button>
      </form>

      <section
        class="car-list"
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>

      <section class="stats-panel" aria-label="Сводка по автомобилям"></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
