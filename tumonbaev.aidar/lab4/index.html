<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4 — Команды</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="page-title">Команды</h1>

      <form class="team-form" data-testid="entity-form">
        <label class="field">
          <span class="field-label">Название команды</span>
          <input
            class="field-input"
            type="text"
            name="name"
            required
            autocomplete="off"
          />
        </label>
        <button class="button button-primary" type="submit">
          Добавить команду
        </button>
      </form>

      <section class="team-list" data-testid="entity-list"></section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
