<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 1 — Пагинация</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="page-title">Постраничная навигация</h1>

      <nav class="pagination" aria-label="Постраничная навигация">
        <ul class="pagination-list">
          <li class="pagination-item">
            <button
              type="button"
              class="pagination-link"
              aria-label="Предыдущая страница"
            >
              &lt;
            </button>
          </li>
          <li class="pagination-item">
            <button
              type="button"
              class="pagination-link pagination-link-active"
              aria-current="page"
            >
              1
            </button>
          </li>
          <li class="pagination-item">
            <button type="button" class="pagination-link">2</button>
          </li>
          <li class="pagination-item">
            <button type="button" class="pagination-link">3</button>
          </li>
          <li class="pagination-item">
            <button
              type="button"
              class="pagination-link"
              aria-label="Следующая страница"
            >
              &gt;
            </button>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
