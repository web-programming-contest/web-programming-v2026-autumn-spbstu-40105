<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Лабораторная работа 4</h1>
      <form data-testid="entity-form">
        <label for="title">Название рецепта:</label>
        <input type="text" id="title" name="title" required />

        <label for="ingredients">Ингредиенты (через запятую):</label>
        <input type="text" id="ingredients" name="ingredients" />

        <label for="steps">Шаги приготовления (через запятую):</label>
        <input type="text" id="steps" name="steps" />
        <button type="submit">Добавить</button>
      </form>
      <section
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
